[workspace]
name = "organoid_pipeline"
version = "0.1.0"
description = "Low-pass WGS somatic SNV calling for monoclonal organoids"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.11"
snakemake-minimal = ">=9,<10"
snakemake-executor-plugin-slurm = ">=0.1"
pyyaml = ">=6"
uv = ">=0.8"
fastqc = "*"
bwa = "*"
samtools = "*"
picard = "*"
bedtools = "*"
multiqc = "*"
htslib = "*"
ucsc-liftover = "*"
vt = "*"
bcftools = "*"
mosdepth = "*"

[tasks]
python-sync = "uv sync --locked"
provision-grch38 = "python scripts/provision_grch38.py"
provision-grch37 = "python scripts/provision_grch37.py"
test = { cmd = "env TMPDIR=tmp/codex uv run python -m pytest -q --basetemp=tmp/codex/pytest", depends-on = ["python-sync"] }
lint = { cmd = "uv run python -m ruff check scripts/downsample_alignment.py scripts/fetch_verified.py scripts/provision_grch37.py scripts/provision_grch38.py scripts/run_seqc2_benchmark.py workflow/scripts/allele_recount.py workflow/scripts/benchmark_metrics.py workflow/scripts/caller_tiers.py workflow/scripts/catalog_filter.py workflow/scripts/cohort_union.py workflow/scripts/sample_inputs.py workflow/scripts/sbs96.py workflow/scripts/validate_alignment.py workflow/scripts/wgs_coverage_mqc.py tests/create_dryrun_fixture.py tests/test_grch37_wgs.py tests/test_organoid_pipeline.py tests/test_provision_grch38.py tests/test_wgs_coverage_mqc.py", depends-on = ["python-sync"] }
format-check = { cmd = "uv run python -m ruff format --check scripts/downsample_alignment.py scripts/fetch_verified.py scripts/provision_grch37.py scripts/provision_grch38.py scripts/run_seqc2_benchmark.py workflow/scripts/allele_recount.py workflow/scripts/benchmark_metrics.py workflow/scripts/caller_tiers.py workflow/scripts/catalog_filter.py workflow/scripts/cohort_union.py workflow/scripts/sample_inputs.py workflow/scripts/sbs96.py workflow/scripts/validate_alignment.py workflow/scripts/wgs_coverage_mqc.py tests/create_dryrun_fixture.py tests/test_grch37_wgs.py tests/test_organoid_pipeline.py tests/test_provision_grch38.py tests/test_wgs_coverage_mqc.py", depends-on = ["python-sync"] }
dry-run = "env TMPDIR=tmp/codex XDG_CACHE_HOME=tmp/codex/cache snakemake --dry-run --cores 1"
run-local = "snakemake --cores 8 --rerun-incomplete"
run-slurm = "snakemake --profile config/slurm --rerun-incomplete"
