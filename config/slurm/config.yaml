# Snakemake 9 SLURM profile
# Usage: snakemake --profile config/slurm

# Executor
executor: slurm

# SLURM default resources
default-resources:
  - runtime=60
  - mem_mb=4096

# Global scheduler token limits for compute-heavy calling shards.
resources:
  - mutect2_shards=32
  - haplotypecaller_shards=16

# Per-rule resource overrides
set-resources:
  bwa_mem:
    runtime: 1440
    mem_mb: 16384
  bwa_mem_paired:
    runtime: 1440
    mem_mb: 49152
  mark_duplicates:
    runtime: 480
    mem_mb: 49152
  split_wgs_intervals:
    mem_mb: 8192
  fastqc:
    runtime: 360
    mem_mb: 4096
  strelka_annotate_af_snvs:
    runtime: 120
    mem_mb: 4096
  strelka_normalize:
    runtime: 120
    mem_mb: 8192
  mutect2_panel_of_normals:
